services:
  - type: web
    name: codeinsight-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: codeinsight
      - key: DB_USER
        value: codeuser
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSL
        value: "true"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /api/ready