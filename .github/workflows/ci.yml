name: CI Pipeline

on:
  push:
    branches: [main, develop, CodeInsight-V2]
  pull_request:
    branches: [main, CodeInsight-V2]

# Cancel in-progress runs on same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Backend Unit/Integration Tests
  # ──────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeinsight_test
          POSTGRES_USER: codeuser
          POSTGRES_PASSWORD: codepassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Load database schema
        run: PGPASSWORD=codepassword123 psql -h localhost -U codeuser -d codeinsight_test -f schema.sql
        working-directory: backend

      - name: Run backend tests
        run: npm run test:ci
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight_test
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SANDBOX_TIMEOUT_MS: 5000
          JWT_SECRET: ci-test-secret-key
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Job 2: Frontend Tests + Build
  # ──────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

  # ──────────────────────────────────────────────────────
  # Job 3: Lint + Code Quality
  # ──────────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint (backend)
        run: npx eslint backend/ --max-warnings 50
        continue-on-error: true

      - name: ESLint (frontend)
        run: npx eslint frontend/src/ --max-warnings 50
        continue-on-error: true

      - name: Check for console.log in production code
        run: |
          count=$(grep -r "console\.log" --include="*.js" --include="*.jsx" \
            --exclude-dir=node_modules --exclude-dir=test --exclude-dir="*test*" \
            --exclude="*.test.js" --exclude="*.spec.js" --exclude-dir=coverage \
            --exclude-dir=.github --exclude-dir=simulation . | wc -l)
          echo "console.log occurrences: $count"
          if [ "$count" -gt 5 ]; then
            echo "::warning::Found $count console.log calls in production code"
          fi

      - name: Check for TODO/FIXME comments
        run: |
          count=$(grep -rn "TODO\|FIXME\|HACK\|XXX" --include="*.js" --include="*.jsx" \
            --exclude-dir=node_modules --exclude-dir=test --exclude-dir=simulation \
            --exclude="*.test.js" . | wc -l)
          echo "TODO/FIXME/HACK markers: $count"

      - name: Check for hardcoded secrets
        run: |
          issues=$(grep -rn "password\s*=\s*['\"]" \
            --include="*.js" --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude=".env*" \
            --exclude="*.test.js" \
            --exclude-dir=test \
            --exclude-dir=simulation . 2>/dev/null \
            | grep -v "process.env\|require\|config\|example\|default\|test" | wc -l)
          echo "Potential hardcoded secrets: $issues"
          if [ "$issues" -gt 0 ]; then
            echo "::warning::Found $issues potential hardcoded secrets"
          fi

      - name: npm audit (production dependencies)
        run: |
          echo "=== Backend Audit ==="
          cd backend && npm audit --audit-level=high 2>&1 || true
          cd ..
          echo ""
          echo "=== Frontend Audit ==="
          cd frontend && npm audit --audit-level=high 2>&1 || true
          cd ..
          echo ""
          echo "=== Root Audit ==="
          npm audit --audit-level=high 2>&1 || true

  # ──────────────────────────────────────────────────────
  # Job 4: E2E Tests (Playwright)
  # ──────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeinsight
          POSTGRES_USER: codeuser
          POSTGRES_PASSWORD: codepassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Load database schema
        run: PGPASSWORD=codepassword123 psql -h localhost -U codeuser -d codeinsight -f schema.sql
        working-directory: backend

      - name: Seed E2E test data
        run: node scripts/seed_e2e_data.js
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          NODE_ENV: test

      - name: Start backend
        run: |
          node server.js &
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            sleep 2
          done
          curl -s http://127.0.0.1:5000/api/health || (echo "Backend failed to start" && exit 1)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key
          PORT: 5000
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173

      - name: Run E2E tests (Chromium)
        run: npx playwright test --config=playwright.config.js --project=chromium
        env:
          CI: true
          PLAYWRIGHT: 1

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Job 5: Performance Benchmark (main branch only)
  # ──────────────────────────────────────────────────────
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-22.04
    needs: [backend-tests]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeinsight_test
          POSTGRES_USER: codeuser
          POSTGRES_PASSWORD: codepassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Load database schema
        run: PGPASSWORD=codepassword123 psql -h localhost -U codeuser -d codeinsight_test -f schema.sql
        working-directory: backend

      - name: Start backend
        run: |
          node server.js &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5000/api/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -s http://127.0.0.1:5000/api/health || (echo "Backend failed" && exit 1)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight_test
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key
          PORT: 5000
          NODE_ENV: test

      - name: Run benchmark
        run: node tests/load/benchmark.js --concurrency=5 --requests=50
        env:
          CI: true

  # ──────────────────────────────────────────────────────
  # Job 6: Notify on completion
  # ──────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-22.04
    needs: [backend-tests, frontend-tests, lint, e2e-tests]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [ "${{ needs.backend-tests.result }}" = "failure" ] || \
             [ "${{ needs.frontend-tests.result }}" = "failure" ] || \
             [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" = "failure" ]; then
            echo "conclusion=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=CI pipeline FAILED" >> $GITHUB_OUTPUT
          elif [ "${{ needs.backend-tests.result }}" = "cancelled" ] || \
               [ "${{ needs.frontend-tests.result }}" = "cancelled" ] || \
               [ "${{ needs.lint.result }}" = "cancelled" ] || \
               [ "${{ needs.e2e-tests.result }}" = "cancelled" ]; then
            echo "conclusion=cancelled" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "message=CI pipeline was CANCELLED" >> $GITHUB_OUTPUT
          else
            echo "conclusion=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=CI pipeline PASSED" >> $GITHUB_OUTPUT
          fi

      - name: Create commit status
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ steps.status.outputs.conclusion }}';
            const message = '${{ steps.status.outputs.message }}';
            const emoji = '${{ steps.status.outputs.emoji }}';
            
            // Get the SHA from the event
            let sha = context.sha;
            if (context.eventName === 'pull_request') {
              sha = context.payload.pull_request.head.sha;
            }
            
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: conclusion === 'success' ? 'success' : conclusion === 'failure' ? 'failure' : 'pending',
              description: `${emoji} ${message}`,
              context: 'CI Pipeline',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const emoji = '${{ steps.status.outputs.emoji }}';
            const message = '${{ steps.status.outputs.message }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const body = `## ${emoji} ${message}\n\n` +
              `| Job | Status |\n|-----|--------|\n` +
              `| Backend Tests | ${{ needs.backend-tests.result == 'success' && '✅' || needs.backend-tests.result == 'failure' && '❌' || '⚠️' }} ${{ needs.backend-tests.result }} |\n` +
              `| Frontend Tests | ${{ needs.frontend-tests.result == 'success' && '✅' || needs.frontend-tests.result == 'failure' && '❌' || '⚠️' }} ${{ needs.frontend-tests.result }} |\n` +
              `| Code Quality | ${{ needs.lint.result == 'success' && '✅' || needs.lint.result == 'failure' && '❌' || '⚠️' }} ${{ needs.lint.result }} |\n` +
              `| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅' || needs.e2e-tests.result == 'failure' && '❌' || '⚠️' }} ${{ needs.e2e-tests.result }} |\n\n` +
              `[View full pipeline run](${runUrl})`;
            
            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('CI Pipeline')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
