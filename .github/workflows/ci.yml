name: CI Pipeline

on:
  push:
    branches: [main, develop, CodeInsight-V2]
  pull_request:
    branches: [main, CodeInsight-V2]

# Cancel in-progress runs on same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Backend Unit/Integration Tests
  # ──────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeinsight_test
          POSTGRES_USER: codeuser
          POSTGRES_PASSWORD: codepassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Load database schema
        run: PGPASSWORD=codepassword123 psql -h localhost -U codeuser -d codeinsight_test -f schema.sql
        working-directory: backend

      - name: Pre-pull sandbox image
        run: docker pull gcc:14-bookworm

      - name: Run backend tests
        run: npm run test:ci
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight_test
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SANDBOX_TIMEOUT_MS: 5000
          JWT_SECRET: ci-test-secret-key
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Job 2: Frontend Tests + Build
  # ──────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

  # ──────────────────────────────────────────────────────
  # Job 3: Lint + Code Quality
  # ──────────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint (backend)
        run: npx eslint backend/ --max-warnings 50
        continue-on-error: true

      - name: ESLint (frontend)
        run: npx eslint frontend/src/ --max-warnings 50
        continue-on-error: true

      - name: Check for console.log in production code
        run: |
          count=$(grep -r "console\.log" --include="*.js" --include="*.jsx" \
            --exclude-dir=node_modules --exclude-dir=test --exclude-dir="*test*" \
            --exclude="*.test.js" --exclude="*.spec.js" --exclude-dir=coverage \
            --exclude-dir=.github --exclude-dir=simulation . | wc -l)
          echo "console.log occurrences: $count"
          if [ "$count" -gt 5 ]; then
            echo "::warning::Found $count console.log calls in production code"
          fi

      - name: Check for TODO/FIXME comments
        run: |
          count=$(grep -rn "TODO\|FIXME\|HACK\|XXX" --include="*.js" --include="*.jsx" \
            --exclude-dir=node_modules --exclude-dir=test --exclude-dir=simulation \
            --exclude="*.test.js" . | wc -l)
          echo "TODO/FIXME/HACK markers: $count"

      - name: Check for hardcoded secrets
        run: |
          issues=$(grep -rn "password\s*=\s*['\"]" \
            --include="*.js" --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude=".env*" \
            --exclude="*.test.js" \
            --exclude-dir=test \
            --exclude-dir=simulation . 2>/dev/null \
            | grep -v "process.env\|require\|config\|example\|default\|test" | wc -l)
          echo "Potential hardcoded secrets: $issues"
          if [ "$issues" -gt 0 ]; then
            echo "::warning::Found $issues potential hardcoded secrets"
          fi

      - name: npm audit (production dependencies)
        run: |
          echo "=== Backend Audit ==="
          cd backend && npm audit --audit-level=high 2>&1 || true
          cd ..
          echo ""
          echo "=== Frontend Audit ==="
          cd frontend && npm audit --audit-level=high 2>&1 || true
          cd ..
          echo ""
          echo "=== Root Audit ==="
          npm audit --audit-level=high 2>&1 || true

  # ──────────────────────────────────────────────────────
  # Job 4: E2E Tests (Playwright)
  # ──────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeinsight
          POSTGRES_USER: codeuser
          POSTGRES_PASSWORD: codepassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Load database schema
        run: PGPASSWORD=codepassword123 psql -h localhost -U codeuser -d codeinsight -f schema.sql
        working-directory: backend

      - name: Seed E2E test data
        run: node scripts/seed_e2e_data.js
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          NODE_ENV: test

      - name: Start backend
        run: |
          node server.js &
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            sleep 2
          done
          curl -s http://127.0.0.1:5000/api/health || (echo "Backend failed to start" && exit 1)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key
          PORT: 5000
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173

      - name: Run E2E tests (Chromium)
        run: npx playwright test --config=playwright.config.js --project=chromium
        env:
          CI: true
          PLAYWRIGHT: 1

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  # Job 5: Performance Benchmark (main branch only)
  # ──────────────────────────────────────────────────────
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-22.04
    needs: [backend-tests]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeinsight_test
          POSTGRES_USER: codeuser
          POSTGRES_PASSWORD: codepassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Load database schema
        run: PGPASSWORD=codepassword123 psql -h localhost -U codeuser -d codeinsight_test -f schema.sql
        working-directory: backend

      - name: Start backend
        run: |
          node server.js &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:5000/api/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -s http://127.0.0.1:5000/api/health || (echo "Backend failed" && exit 1)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: codeinsight_test
          DB_USER: codeuser
          DB_PASSWORD: codepassword123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key
          PORT: 5000
          NODE_ENV: test

      - name: Run benchmark
        run: node tests/load/benchmark.js --concurrency=5 --requests=50
        env:
          CI: true
