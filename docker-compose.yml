version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: codeinsight
      POSTGRES_USER: codeuser
      POSTGRES_PASSWORD: codepassword123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeuser -d codeinsight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: codeinsight
      DB_USER: codeuser
      DB_PASSWORD: codepassword123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
  redis_data:
